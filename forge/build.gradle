plugins {
	id 'net.neoforged.moddev.legacyforge'
	id 'maven-publish'
}

base {
	archivesName = "${rootProject.name}-forge-${project.minecraft_version}"
}

sourceSets {
	main {
		java.setSrcDirs([project(':common').file('src/main/java'), file('src/main/java')])
		resources.setSrcDirs([project(':common').file('src/main/resources'), file('src/main/resources')])
	}
}

legacyForge {
	version = project.forge_version

	accessTransformers.from(project(':common').file('src/main/resources/META-INF/accesstransformer.cfg'))

	runs {
		client {
			client()
			gameDirectory = file('runs/client')
		}
	}

	mods {
		tritium_music {
			sourceSet sourceSets.main
		}
	}
}

def harfbuzzNatives = configurations.create('harfbuzzNatives')
def harfbuzzNativesJar = tasks.register('harfbuzzNativesJar', Jar) {
	archiveBaseName = 'tritium-music-harfbuzz-natives'
	archiveVersion = project.lwjgl_version
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from {
		harfbuzzNatives.collect { zipTree(it) }
	}
	include '**/*.dll'
	include '**/*.so'
	include '**/*.dylib'
	manifest {
		attributes 'Automatic-Module-Name': 'tritium.music.harfBuzzNatives'
	}
}

dependencies {
	compileOnly "org.projectlombok:lombok:${project.lombok_version}"
	annotationProcessor "org.projectlombok:lombok:${project.lombok_version}"
	compileOnly "org.jspecify:jspecify:${project.jspecify_version}"

	implementation "com.google.code.gson:gson:${project.gson_version}"
	implementation "net.java.dev.jna:jna:${project.jna_version}"
	implementation "net.java.dev.jna:jna-platform:${project.jna_version}"

	jarJar(implementation("com.google.zxing:core:${project.zxing_version}"))
	jarJar(implementation("org.lwjgl:lwjgl-harfbuzz:${project.lwjgl_version}"))
	jarJar(implementation("org.lwjgl:lwjgl-freetype:${project.lwjgl_version}"))
	jarJar(implementation("com.microsoft.onnxruntime:onnxruntime:${project.onnxruntime_version}"))
	jarJar(implementation("com.tianscar.soundtouch:soundtouch-jni-core:${project.soundtouch_jni_version}"))
	jarJar(implementation("com.tianscar.soundtouch:soundtouch-jni-javase:${project.soundtouch_jni_version}"))

	['natives-windows', 'natives-windows-arm64', 'natives-linux', 'natives-macos', 'natives-macos-arm64'].each {
		add(harfbuzzNatives.name, "org.lwjgl:lwjgl-harfbuzz:${project.lwjgl_version}:$it")
		add(harfbuzzNatives.name, "org.lwjgl:lwjgl-freetype:${project.lwjgl_version}:$it")
	}

	def osName = System.getProperty('os.name').toLowerCase()
	def archName = System.getProperty('os.arch').toLowerCase()
	def aarch64 = archName.startsWith('aarch64') || archName.startsWith('arm64')
	def lwjglNatives = osName.contains('win')
			? (aarch64 ? 'natives-windows-arm64' : 'natives-windows')
			: osName.contains('mac')
			? (aarch64 ? 'natives-macos-arm64' : 'natives-macos')
			: 'natives-linux'
	runtimeOnly "org.lwjgl:lwjgl-harfbuzz:${project.lwjgl_version}:$lwjglNatives"
	runtimeOnly "org.lwjgl:lwjgl-freetype:${project.lwjgl_version}:$lwjglNatives"

	jarJar files(harfbuzzNativesJar)
}

processResources {
	def properties = [
			version                    : project.version,
			forge_version              : project.forge_version,
			forge_loader_version_range : project.forge_loader_version_range
	]
	inputs.properties properties
	filesMatching('META-INF/mods.toml') {
		expand properties
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 17
	options.encoding = 'UTF-8'
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(17)
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from(rootProject.files('LICENSE', 'COPYING', 'THIRD_PARTY_NOTICES.md', 'LICENSE_BASIC_PITCH',
			'LICENSE_SOUNDTOUCH', 'LICENSE_SOUNDTOUCH_JNI')) {
		rename { "${it}_${rootProject.name}" }
	}

	doLast {
		rootProject.stripOnnxRuntimeNatives(archiveFile.get().asFile)
	}
}

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			from components.java
		}
	}
}
