plugins {
	id 'net.fabricmc.fabric-loom-remap'
	id 'maven-publish'
}

base {
	archivesName = "${rootProject.name}-fabric-${project.minecraft_version}"
}

sourceSets {
	main {
		java.setSrcDirs([project(':common').file('src/main/java'), file('src/main/java')])
		resources.setSrcDirs([project(':common').file('src/main/resources'), file('src/main/resources')])
	}
}

loom {
	accessWidenerPath = project(':common').file('src/main/resources/tritium-music.accesswidener')
	mixin {
		useLegacyMixinAp = true
		defaultRefmapName = 'tritium-music-refmap.json'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	compileOnly "org.projectlombok:lombok:${project.lombok_version}"
	annotationProcessor "org.projectlombok:lombok:${project.lombok_version}"
	compileOnly "org.jspecify:jspecify:${project.jspecify_version}"

	implementation "com.google.code.gson:gson:${project.gson_version}"
	include implementation("com.google.zxing:core:${project.zxing_version}")
	include implementation("net.java.dev.jna:jna:${project.jna_version}")
	include implementation("net.java.dev.jna:jna-platform:${project.jna_version}")
	include implementation("com.microsoft.onnxruntime:onnxruntime:${project.onnxruntime_version}")
	include implementation("com.tianscar.soundtouch:soundtouch-jni-core:${project.soundtouch_jni_version}")
	include implementation("com.tianscar.soundtouch:soundtouch-jni-javase:${project.soundtouch_jni_version}")
	['natives-windows', 'natives-windows-arm64', 'natives-linux', 'natives-macos', 'natives-macos-arm64'].each {
		include "org.lwjgl:lwjgl-harfbuzz:${project.lwjgl_version}:$it"
		include "org.lwjgl:lwjgl-freetype:${project.lwjgl_version}:$it"
	}

	def osName = System.getProperty('os.name').toLowerCase()
	def archName = System.getProperty('os.arch').toLowerCase()
	def aarch64 = archName.startsWith('aarch64') || archName.startsWith('arm64')
	def lwjglNatives = osName.contains('win')
			? (aarch64 ? 'natives-windows-arm64' : 'natives-windows')
			: osName.contains('mac')
			? (aarch64 ? 'natives-macos-arm64' : 'natives-macos')
			: 'natives-linux'
	runtimeOnly "org.lwjgl:lwjgl-harfbuzz:${project.lwjgl_version}:$lwjglNatives"
	runtimeOnly "org.lwjgl:lwjgl-freetype:${project.lwjgl_version}:$lwjglNatives"

	modImplementation "maven.modrinth:modmenu:${project.modmenu_version}"
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 17
	options.encoding = 'UTF-8'
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(17)
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from(rootProject.files('LICENSE', 'COPYING', 'THIRD_PARTY_NOTICES.md', 'LICENSE_BASIC_PITCH',
			'LICENSE_SOUNDTOUCH', 'LICENSE_SOUNDTOUCH_JNI')) {
		rename { "${it}_${rootProject.name}" }
	}
}

def stripOnnxRuntimeNatives = tasks.register('stripOnnxRuntimeNatives') {
	doLast {
		rootProject.stripOnnxRuntimeNatives(tasks.named('remapJar').get().archiveFile.get().asFile)
	}
}

tasks.named('remapJar') {
	finalizedBy stripOnnxRuntimeNatives
}

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			from components.java
		}
	}
}
